baseURL                = "https://lunemere.github.io/"
theme                  = "blowfish"
defaultContentLanguage = "zh-cn"
hasCJKLanguage         = true
enableRobotsTXT        = true
enableEmoji            = true
summaryLength          = 0

[pagination]
    pagerSize = 10

[permalinks]
    post = "/p/:slug/"
    page = "/:slug/"

[taxonomies]
    tag      = "tags"
    category = "categories"
    series   = "series"

[outputs]
    home = ["HTML", "RSS", "JSON"]   # JSON 用于站内搜索

[related]
    threshold = 0
    toLower   = false
    [[related.indices]]
        name   = "tags"
        weight = 100
    [[related.indices]]
        name   = "categories"
        weight = 100
    [[related.indices]]
        name   = "series"
        weight = 50
