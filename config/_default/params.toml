mainSections         = ["post"]
colorScheme          = "congo"   # 可选: blowfish congo ocean forest fire slate neon avocado autumn marvel noir github ...
defaultAppearance    = "light"
autoSwitchAppearance = true         # 跟随系统深浅色
enableSearch         = true
enableCodeCopy       = true
rssFullContent       = true
defaultBackgroundImage = "img/background.jpg"
defaultFeaturedImage   = "img/default-feature.jpg"
highlightCurrentMenuArea = true
smartTOC             = true
smartTOCHideUnfocusedChildren = false

[header]
    layout = "fixed-fill-blur"

[footer]
    showMenu               = true
    showCopyright          = true
    showThemeAttribution   = true
    showAppearanceSwitcher = true
    showScrollToTop        = true

[homepage]
    layout          = "background"
    layoutBackgroundBlur = true
    showRecent      = true
    showRecentItems = 6
    showMoreLink    = true
    showMoreLinkDest = "/post/"
    cardView        = true
    cardViewScreenWidth = false

[article]
    showDate               = true
    showDateUpdated        = false
    showAuthor             = true
    showHero               = true
    heroStyle              = "big"
    layoutBackgroundBlur   = true
    layoutBackgroundHeaderSpace = false
    showBreadcrumbs        = false
    showDraftLabel         = true
    showHeadingAnchors     = true
    showPagination         = true
    showReadingTime        = true
    showReadingProgress    = true
    showTableOfContents    = true
    showTaxonomies         = true
    showWordCount          = true
    showZenMode            = true
    showRelatedContent     = true
    relatedContentLimit    = 3

[list]
    showBreadcrumbs = false
    showSummary     = true
    showCards       = true
    groupByYear     = false
    cardView        = true

[taxonomy]
    cardView      = false
    showTermCount = true

[term]
    cardView            = true
    showTableOfContents = false
    groupByYear         = false

[sitemap]
    excludedKinds = ["taxonomy", "term"]
