mainSections         = ["post"]
colorScheme          = "blowfish"   # 可选: blowfish congo ocean forest fire slate neon avocado autumn marvel noir github ...
defaultAppearance    = "light"
autoSwitchAppearance = true         # 跟随系统深浅色
enableSearch         = true
enableCodeCopy       = true
rssFullContent       = true
defaultBackgroundImage = ""

[header]
    layout = "fixed-fill-blur"

[footer]
    showMenu               = true
    showCopyright          = true
    showThemeAttribution   = true
    showAppearanceSwitcher = true
    showScrollToTop        = true

[homepage]
    layout          = "profile"
    showRecent      = true
    showRecentItems = 6
    showMoreLink    = true
    showMoreLinkDest = "/post/"
    cardView        = true
    cardViewScreenWidth = false

[article]
    showDate               = true
    showDateUpdated        = false
    showAuthor             = true
    showHero               = false
    showBreadcrumbs        = false
    showDraftLabel         = true
    showHeadingAnchors     = true
    showPagination         = true
    showReadingTime        = true
    showReadingProgress    = true
    showTableOfContents    = true
    showTaxonomies         = true
    showWordCount          = true
    showZenMode            = true
    showRelatedContent     = true
    relatedContentLimit    = 3

[list]
    showBreadcrumbs = false
    showSummary     = true
    showCards       = false
    groupByYear     = true
    cardView        = false

[taxonomy]
    showTermCount = true

[term]
    showTableOfContents = false
    groupByYear         = false

[sitemap]
    excludedKinds = ["taxonomy", "term"]
