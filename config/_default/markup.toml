[goldmark]
    [goldmark.extensions.passthrough]
        enable = true
        [goldmark.extensions.passthrough.delimiters]
            block  = [["\\[", "\\]"], ["$$", "$$"]]
            inline = [["\\(", "\\)"], ["$", "$"]]
    [goldmark.renderer]
        unsafe = true

[highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false

[tableOfContents]
    startLevel = 1
    endLevel   = 4
